# Render Blueprint for AG FinTax landing page.
# Two services: static site for the landing page, and a small Node API for
# lead + pageview ingestion (Firestore-backed). The static site rewrites
# /api/* to the API service so the browser sees a single origin (no CORS,
# real IPs preserved via X-Forwarded-For on Render's edge).

services:
  # ─── Static landing page ─────────────────────────────────────────────
  - type: web
    runtime: static
    name: agfintax-site
    rootDir: site
    buildCommand: ""        # nothing to build — plain HTML/CSS/JS
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      # SPA-style fallback so deep links return index.html.
      # The browser calls the API directly using window.AGFT_CONFIG.apiBase
      # (set in site/index.html) — Render static-site rewrites don't expand
      # :splat to external URLs reliably, so we skip that approach. CORS on
      # the API service permits the static site's origin via ALLOWED_ORIGIN.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # ─── Lead + pageview ingestion API (Firestore) ───────────────────────
  - type: web
    runtime: node
    name: agfintax-api
    rootDir: server
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false           # set in Render dashboard
      - key: FIREBASE_CLIENT_EMAIL
        sync: false           # set in Render dashboard
      - key: FIREBASE_PRIVATE_KEY
        sync: false           # set in Render dashboard (paste with literal \n)
      - key: ALLOWED_ORIGIN
        sync: false           # e.g. https://agfintax.com,https://www.agfintax.com
